<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karothingal Super Series</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            background-image: url('images/bg-1.jpg');
            background-size: cover;
            background-position: center;
        }

        header {
            background-color: #4CAF50;
            color: white;
            text-align: center;
            padding: 30px 0;
        }

        main {
            flex: 1;
            padding: 20px;
        }

        #status {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 20px;
            color: blue;
            font-weight: bold;
            margin-top: 40px;
            margin-bottom: 40px;
            background: rgba(255, 255, 255, 0.85);
            padding: 10px;
            border-radius: 10px;
        }

        #status .team-name {
            width: 35%;
            text-align: center;
            font-weight: bold;
        }

        #status .score {
            font-size: 28px;
        }

        .left-score, .right-score {
            margin: 0 5px;
        }

        .separator {
            margin: 0 10px;
        }

        .icon-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 60px;
        }

        .icon {
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            transition: transform 0.2s;
            text-decoration: none;
        }

        .icon:hover {
            transform: scale(1.1);
        }

        .icon img {
            width: 100%;
            max-width: 90px;
            height: auto;
        }

        footer {
            text-align: center;
            padding: 20px;
            background-color: #333;
            color: white;
            margin-top: auto;
        }

        .icon-title {
            margin-top: 10px;
            color: white;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <header>
        <h1>KAROTHINGAL SUPER SERIES</h1>
    </header>

    <main>
        <div id="status">
            <span class="team-name">KAROTHINGAL SUPER KINGS</span>
            <span class="score left-score" id="winsA">0</span>
            <span class="score separator">-</span>
            <span class="score right-score" id="winsB">0</span>
            <span class="team-name">FIGHTERS KAROTHINGAL</span>
        </div>

        <section id="icons">
            <div class="icon-grid">
                <a href="players.html" class="icon">
                    <img src="images/Players.png" alt="Players">
                    <div class="icon-title">Players</div>
                </a>
                <a href="scoreboard.html" class="icon">
                    <img src="images/Scoreboard.png" alt="Scoreboard">
                    <div class="icon-title">Scoreboard</div>
                </a>
                <a href="statistics.html" class="icon">
                    <img src="images/Statistics.png" alt="Statistics">
                    <div class="icon-title">Statistics</div>
                </a>
                <a href="gallery.html" class="icon">
                    <img src="images/Gallery.png" alt="Gallery">
                    <div class="icon-title">Gallery</div>
                </a>
                <a href="fixtures.html" class="icon">
                    <img src="images/Fixtures.png" alt="Fixtures">
                    <div class="icon-title">Fixtures</div>
                </a>
                <a href="calculator.html" class="icon">
                    <img src="images/Calculator.png" alt="Calculator">
                    <div class="icon-title">Calculator</div>
                </a>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2024 Karothingal Super Series. All rights reserved.</p>
    </footer>

    <script src="data.js"></script>
    <script src="scores.js"></script>
    <script>
        // ---------- Home score ----------
        var series = computeSeries();
        document.getElementById("winsA").textContent = series.winsA;
        document.getElementById("winsB").textContent = series.winsB;
    </script>
</body>
</html>
