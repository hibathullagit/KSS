<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Statistics</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            background-image: url('images/bg-1.jpg');
            background-size: cover;
            background-position: center;
        }

        header {
            background-color: #4CAF50;
            color: white;
            text-align: center;
            padding: 30px 0;
        }

        header h1 { margin: 0; }

        main {
            flex: 1;
            padding: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .card h2 {
            margin: 0 0 12px;
            font-size: 18px;
            text-align: center;
            color: white;
            padding: 8px;
            border-radius: 8px;
        }

        .orange h2 { background: #ff9800; }
        .purple h2 { background: #7b1fa2; }
        .records h2 { background: #4CAF50; }
        .teams h2 { background: #1976d2; }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 15px;
        }

        th, td {
            padding: 8px 4px;
            border-bottom: 1px solid #ddd;
            text-align: center;
        }

        th { background: #eee; font-size: 13px; }

        th:nth-child(2), td:nth-child(2) { text-align: left; }

        td small {
            display: block;
            font-size: 11px;
            color: #777;
        }

        .orange tr.leader { background: #fff3e0; font-weight: bold; }
        .purple tr.leader { background: #f3e5f5; font-weight: bold; }

        .badge {
            display: inline-block;
            width: 22px;
            height: 22px;
            margin-left: 6px;
            vertical-align: middle;
        }

        .badge svg { width: 22px; height: 22px; display: block; fill: currentColor; }

        .orange .badge { color: #ff9800; }
        .purple .badge { color: #7b1fa2; }

        .record {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #ddd;
        }

        .record:last-child { border-bottom: none; }
        .record .label { font-size: 13px; color: #555; }
        .record .who { font-weight: bold; }
        .record .who small { display: block; font-weight: normal; color: #777; font-size: 11px; }
        .record .val { font-size: 22px; font-weight: bold; color: #2e7d32; }

        .team-table td:first-child, .team-table th:first-child { text-align: left; }

        .empty { text-align: center; color: #777; padding: 10px; }

        footer {
            text-align: center;
            padding: 0;
            background-color: #333;
            color: white;
        }

        .buttons {
            display: flex;
            justify-content: space-between;
            padding: 10px;
            width: 100%;
            box-sizing: border-box;
        }

        .button {
            background-color: #555;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 5px;
            margin: 10px;
        }

        .button:hover { background-color: #777; }
    </style>
</head>
<body>
    <header>
        <h1>STATISTICS</h1>
    </header>

    <main>
        <div class="card orange" id="orangeCard"></div>
        <div class="card purple" id="purpleCard"></div>
        <div class="card records" id="recordsCard"></div>
        <div class="card teams" id="teamsCard"></div>
    </main>

    <footer>
        <div class="buttons">
            <a href="kss.html" class="button">Home</a>
            <a href="javascript:history.back()" class="button">Back</a>
        </div>
    </footer>

    <script src="data.js"></script>
    <script src="scores.js"></script>
    <script>
        // Cap icon (takes the colour of its table: orange / purple)
        var CAP_SVG = '<svg viewBox="0 0 24 24">' +
                      '<path d="M4 14.5C4 9.5 7.5 6.5 12 6.5C16 6.5 19 9 19.5 13.5V14.5Z"/>' +
                      '<path d="M4 15.6H19.5C21.8 15.6 23 16.4 22.6 17.6C22.2 18.6 19.8 18.7 17 18.2L4 17.6Z"/>' +
                      '<circle cx="12" cy="5.6" r="1.2"/></svg>';

        computeSeries();   // numbers the matches

        // ---------- Add up every player ----------
        var players = {};
        MATCHES.forEach(function (m) {
            [[TEAM_A, m.a], [TEAM_B, m.b]].forEach(function (x) {
                (x[1].players || []).forEach(function (p) {
                    var key = x[0] + "|" + p.name;
                    var o = players[key];
                    if (!o) {
                        o = players[key] = { name: p.name, team: x[0], games: 0, runs: 0, wkts: 0,
                                             bestRuns: 0, bestRunsMatch: 0, bestWk: 0, bestWkMatch: 0 };
                    }
                    o.games++;
                    o.runs += p.runs;
                    o.wkts += p.wickets;
                    if (p.runs > o.bestRuns) { o.bestRuns = p.runs; o.bestRunsMatch = m.no; }
                    if (p.wickets > o.bestWk) { o.bestWk = p.wickets; o.bestWkMatch = m.no; }
                });
            });
        });

        var list = Object.keys(players).map(function (k) { return players[k]; });

        // ---------- Orange cap / Purple cap ----------
        function capTable(cardId, title, sortKey, valueHead, extraHead, extraFn) {
            var card = document.getElementById(cardId);
            var html = '<h2>' + title + '</h2>';
            if (list.length === 0) {
                card.innerHTML = html + '<div class="empty">No player stats yet.</div>';
                return;
            }
            var sorted = list.slice().sort(function (a, b) {
                return b[sortKey] - a[sortKey] || a.name.localeCompare(b.name);
            });
            var max = sorted[0][sortKey];
            html += '<table><tr><th>#</th><th>Player</th><th>M</th><th>' + valueHead +
                    '</th><th>' + extraHead + '</th></tr>';
            sorted.forEach(function (p, i) {
                var leader = (p[sortKey] === max && max > 0);
                html += '<tr' + (leader ? ' class="leader"' : '') + '>' +
                        '<td>' + (i + 1) + '</td>' +
                        '<td>' + p.name + (leader ? '<span class="badge">' + CAP_SVG + '</span>' : '') +
                        '<small>' + p.team + '</small></td>' +
                        '<td>' + p.games + '</td>' +
                        '<td>' + p[sortKey] + '</td>' +
                        '<td>' + extraFn(p) + '</td></tr>';
            });
            card.innerHTML = html + '</table>';
        }

        capTable("orangeCard", "ORANGE CAP - MOST RUNS", "runs", "Runs", "Avg",
                 function (p) { return (p.runs / p.games).toFixed(1); });

        capTable("purpleCard", "PURPLE CAP - MOST WICKETS", "wkts", "Wkts", "Best",
                 function (p) { return p.bestWk; });

        // ---------- Records ----------
        var rec = document.getElementById("recordsCard");
        var recHtml = '<h2>RECORDS</h2>';
        if (list.length === 0) {
            rec.innerHTML = recHtml + '<div class="empty">No player stats yet.</div>';
        } else {
            var hs = list[0], bb = list[0];
            list.forEach(function (p) {
                if (p.bestRuns > hs.bestRuns) hs = p;
                if (p.bestWk > bb.bestWk) bb = p;
            });
            function recRow(label, p, val, matchNo) {
                return '<div class="record"><div><div class="label">' + label + '</div>' +
                       '<div class="who">' + p.name + '<small>' + p.team +
                       (matchNo ? ' | Match ' + matchNo : '') + '</small></div></div>' +
                       '<div class="val">' + val + '</div></div>';
            }
            rec.innerHTML = recHtml +
                recRow("Highest score", hs, hs.bestRuns, hs.bestRunsMatch) +
                recRow("Best bowling (wickets in a match)", bb, bb.bestWk, bb.bestWkMatch);
        }

        // ---------- Team totals ----------
        var tA = { runs: 0, wkts: 0 }, tB = { runs: 0, wkts: 0 };
        MATCHES.forEach(function (m) {
            tA.runs += m.a.runs; tA.wkts += m.b.wickets;
            tB.runs += m.b.runs; tB.wkts += m.a.wickets;
        });

        document.getElementById("teamsCard").innerHTML =
            '<h2>TEAM TOTALS</h2>' +
            '<table class="team-table"><tr><th>Team</th><th>Runs</th><th>Wickets</th></tr>' +
            '<tr><td>' + TEAM_A + '</td><td>' + tA.runs + '</td><td>' + tA.wkts + '</td></tr>' +
            '<tr><td>' + TEAM_B + '</td><td>' + tB.runs + '</td><td>' + tB.wkts + '</td></tr></table>';
    </script>
</body>
</html>
