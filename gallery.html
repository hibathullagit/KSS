<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            background-image: url('images/bg-1.jpg');
            background-size: cover;
            background-position: center;
        }

        header {
            background-color: #4CAF50;
            color: white;
            text-align: center;
            padding: 30px 0;
        }

        header h1 { margin: 0; }

        main {
            flex: 1;
            padding: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .card h2 {
            margin: 0 0 12px;
            font-size: 18px;
            color: blue;
        }

        .photo-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
        }

        .photo-grid img,
        .photo-grid .placeholder {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            border-radius: 8px;
            background: #ddd;
            cursor: pointer;
        }

        .placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            color: #aaa;
            cursor: default;
        }

        .note {
            text-align: center;
            color: #555;
            margin: 0 0 12px;
        }

        /* Full-screen viewer */
        #viewer {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #000;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            touch-action: pan-y;
        }

        #viewerImg {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        #viewer .top {
            position: absolute;
            top: 0; left: 0; right: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 18px;
            color: white;
            font-size: 15px;
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0));
        }

        #viewer .close-x {
            font-size: 30px;
            line-height: 1;
            cursor: pointer;
            padding: 0 6px;
        }

        #viewer .caption {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            padding: 40px 18px 22px;
            color: white;
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            background: linear-gradient(rgba(0,0,0,0), rgba(0,0,0,0.75));
        }

        footer {
            text-align: center;
            padding: 0;
            background-color: #333;
            color: white;
        }

        .buttons {
            display: flex;
            justify-content: space-between;
            padding: 10px;
            width: 100%;
            box-sizing: border-box;
        }

        .button {
            background-color: #555;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 5px;
            margin: 10px;
        }

        .button:hover { background-color: #777; }
    </style>
</head>
<body>
    <header>
        <h1>GALLERY</h1>
    </header>

    <main id="albums"></main>

    <div id="viewer">
        <div class="top">
            <span id="counter"></span>
            <span class="close-x" onclick="closeViewer()">&times;</span>
        </div>
        <img id="viewerImg" alt="Photo">
        <div class="caption" id="capTitle"></div>
    </div>

    <footer>
        <div class="buttons">
            <a href="kss.html" class="button">Home</a>
            <a href="javascript:history.back()" class="button">Back</a>
        </div>
    </footer>

    <script src="data.js"></script>
    <script src="photos.js"></script>
    <script>
        // Albums come from ALBUMS in data.js.
        // Only albums with a title and at least one photo are shown.
        var albumList = (typeof ALBUMS !== "undefined" ? ALBUMS : []).filter(function (a) {
            return a && a.title && a.photos && a.photos.length > 0;
        });

        var box = document.getElementById("albums");
        var viewer = document.getElementById("viewer");
        var viewerImg = document.getElementById("viewerImg");
        var viewerAlbum = null;
        var viewerIndex = 0;

        if (albumList.length === 0) {
            var html = '<div class="card"><p class="note">Photos coming soon.</p><div class="photo-grid">';
            for (var i = 0; i < 6; i++) html += '<div class="placeholder">&#128247;</div>';
            box.innerHTML = html + '</div></div>';
        }

        albumList.forEach(function (album, ai) {
            var card = document.createElement("div");
            card.className = "card";

            var title = document.createElement("h2");
            title.textContent = album.title;
            card.appendChild(title);

            var grid = document.createElement("div");
            grid.className = "photo-grid";

            album.photos.forEach(function (file, pi) {
                var img = document.createElement("img");
                img.alt = album.title;
                img.onclick = function () { openViewer(ai, pi); };
                grid.appendChild(img);
                kssShowFile(img, file);   // newest online, or last saved copy
            });

            card.appendChild(grid);
            box.appendChild(card);
        });

        function openViewer(albumIndex, photoIndex) {
            viewerAlbum = albumList[albumIndex];
            viewerIndex = photoIndex;
            showCurrent();
            viewer.style.display = "flex";
        }

        function showCurrent() {
            kssShowFile(viewerImg, viewerAlbum.photos[viewerIndex]);
            document.getElementById("counter").textContent =
                (viewerIndex + 1) + " / " + viewerAlbum.photos.length;
            document.getElementById("capTitle").textContent = viewerAlbum.title;
        }

        function step(direction) {
            var next = viewerIndex + direction;
            if (next < 0 || next >= viewerAlbum.photos.length) return;
            viewerIndex = next;
            showCurrent();
        }

        function closeViewer() {
            viewer.style.display = "none";
        }

        // Swipe left for the next photo, right for the previous one
        var startX = null;
        viewer.addEventListener("touchstart", function (e) {
            startX = e.changedTouches[0].clientX;
        }, { passive: true });

        viewer.addEventListener("touchend", function (e) {
            if (startX === null) return;
            var dx = e.changedTouches[0].clientX - startX;
            startX = null;
            if (Math.abs(dx) > 50) {
                step(dx < 0 ? 1 : -1);
            }
        }, { passive: true });
    </script>
</body>
</html>
