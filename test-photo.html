<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo test</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 20px; background: #f2f2f2; }
        img { width: 260px; height: 260px; object-fit: cover; border-radius: 50%; border: 4px solid #4CAF50; }
        #status { margin: 16px; font-weight: bold; color: #333; }
    </style>
</head>
<body>
    <h2>Photo test</h2>
    <img id="pic" alt="Test photo">
    <div id="status">Loading...</div>

    <script>
        var PHOTO_URL = "https://hibathullagit.github.io/KSS/test.jpg";
        var KEY = "photo:test";

        function showStatus(text) {
            document.getElementById("status").textContent = text;
        }

        function saveAndShow(blob) {
            var reader = new FileReader();
            reader.onload = function () {
                var dataUrl = reader.result;
                try { localStorage.setItem(KEY, dataUrl); } catch (e) {}
                document.getElementById("pic").src = dataUrl;
                showStatus("ONLINE: newest photo shown and saved");
            };
            reader.readAsDataURL(blob);
        }

        function loadPhoto() {
            fetch(PHOTO_URL + "?t=" + Date.now(), { cache: "no-store" })
                .then(function (r) {
                    if (!r.ok) throw new Error("not found");
                    return r.blob();
                })
                .then(saveAndShow)
                .catch(function () {
                    var saved = null;
                    try { saved = localStorage.getItem(KEY); } catch (e) {}
                    if (saved) {
                        document.getElementById("pic").src = saved;
                        showStatus("OFFLINE: last saved photo shown");
                    } else {
                        showStatus("OFFLINE: no saved photo yet");
                    }
                });
        }

        loadPhoto();
    </script>
</body>
</html>
